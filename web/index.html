<!DOCTYPE html>
<html lang="es">
<head>
  <!-- `flutter build web` sustituye $FLUTTER_BASE_HREF (por defecto, "/"). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pequeños Artistas: dibujos para colorear y juegos para aprender, para niños de 4 a 7 años. Funciona sin conexión y sin cuentas.">
  <meta name="theme-color" content="#FF7A59">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pequeños Artistas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pequeños Artistas</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FFF8EC; }
    /* Pantalla de espera mientras se descarga la app (la retira Flutter). */
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, sans-serif; color: #6E6787; font-size: 20px;
    }
    #carga img { width: 128px; height: 128px; border-radius: 28px; }
  </style>
</head>
<body>
  <div id="carga" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span>Preparando tus colores…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (c) c.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
